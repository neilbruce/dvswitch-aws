# apache2.conf - Complete Apache Reverse Proxy & HTTPS Security Configuration
# Place in /etc/apache2/sites-available/dmr-ncs.conf and enable with: a2ensite dmr-ncs.conf

<VirtualHost *:80>
    ServerName dmr.realneilbruce.in
    ServerAlias dvs.realneilbruce.in
    
    # Global HTTP to HTTPS redirection
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =dmr.realneilbruce.in [OR]
    RewriteCond %{SERVER_NAME} =dvs.realneilbruce.in
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# 1. Public Dashboard HTTPS Configuration
<VirtualHost *:443>
    ServerName dmr.realneilbruce.in
    
    DocumentRoot /var/www/dmr-ncs/public
    
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dmr.realneilbruce.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dmr.realneilbruce.in/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    
    # Reverse proxy to Flask / Gunicorn running locally on port 5000 (or node server)
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Support for WebSockets / live dashboards
    RewriteEngine on
    RewriteCond %{HTTP:UPGRADE} ^WebSocket$ [NC]
    RewriteCond %{HTTP:CONNECTION} ^Upgrade$ [NC]
    RewriteRule .* ws://127.0.0.1:5000%{REQUEST_URI} [P,L]
    
    # Forward all other requests to Gunicorn backend
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
    
    # Hardened Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Content-Security-Policy "default-src 'self' https: 'unsafe-inline' 'unsafe-eval' data:; img-src 'self' data: https: referrer;"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Gzip Compression configurations
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    
    ErrorLog ${APACHE_LOG_DIR}/dmr_public_error.log
    CustomLog ${APACHE_LOG_DIR}/dmr_public_access.log combined
</VirtualHost>

# 2. Private Dashboard Web Panel (dvs.realneilbruce.in/admin) HTTPS Configuration
<VirtualHost *:443>
    ServerName dvs.realneilbruce.in
    
    DocumentRoot /var/www/dmr-ncs/private
    
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dvs.realneilbruce.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dvs.realneilbruce.in/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    
    # Root level redirect to Gunicorn login/admin views
    ProxyPreserveHost On
    ProxyRequests Off
    
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
    
    # Advanced Cache Control for static items (optimized frontend performance)
    <FilesMatch "\.(css|js|woff|woff2|png|svg)$">
        Header set Cache-Control "max-age=604800, public"
    </FilesMatch>
    
    # Rigid Security Header standards block all cross frame attacks on /admin section
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    
    ErrorLog ${APACHE_LOG_DIR}/dvs_private_error.log
    CustomLog ${APACHE_LOG_DIR}/dvs_private_access.log combined
</VirtualHost>
