# logrotate.conf - Production Log Rotation Setup for Gunicorn, Apache, and MMDVM logs
# Install by placing inside: /etc/logrotate.d/dmr-ncs

/var/log/gunicorn/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0660 www-data www-data
    sharedscripts
    postrotate
        systemctl reload dmr-ncs.service > /dev/null 2>&1 || true
    endscript
}

/var/log/mmdvm/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0664 root root
}

/var/log/apache2/*_error.log /var/log/apache2/*_access.log {
    daily
    rotate 14
    compress
    missingok
    notifempty
    create 0640 root adm
    sharedscripts
    postrotate
        systemctl reload apache2 > /dev/null 2>&1 || true
    endscript
}
